name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests
      - uses: SublimeText/syntax-test-action@v2
        with:
          package_name: Vibescript
          build: stable
